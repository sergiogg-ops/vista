# vision_model: google/siglip2-base-patch16-naflex
# vision_model: openai/clip-vit-base-patch16
# vision_model: microsoft/trocr-base-printed
# vision_model: deepseek-ai/DeepSeek-OCR
vision_model: PaddlePaddle/PaddleOCR-VL-1.6
mt_model_path: facebook/nllb-200-distilled-600M
train_latents_dir: /home/sgomgon/interlingua_img/OCRMT30k/precomputed_train
valid_latents_dir: /home/sgomgon/interlingua_img/OCRMT30k/precomputed_val
src_lang: zho_Hans
tgt_langs: [eng_Latn, arb_Arab, ben_Beng, spa_Latn, fra_Latn, hin_Deva, ind_Latn, jpn_Jpan, rus_Cyrl, urd_Arab]

adapter_args:
  visual_hidden_size: 1152
  text_hidden_size: 1024
  num_latents: 128
  latent_dim: 1024
  num_self_layers: 4
  cross_heads: 16
  self_heads: 16
  dropout: 0.1

monitor_metric: val_loss
monitor_mode: min

mt_weight: 1.0
ctc_weight: 0.05
align_weight: 1.0
distilling: False

save: checkpoints
project: WMT-OCRMT30k
name: Paddle-Adapter-NLLB
seed: 42

num_workers: 8
train_batch_size: 4
val_batch_size: 16
accumulate_grad: 32
max_steps: 100000
val_check_interval: 4000
unfreeze_milestones: [1875, 3750, 5625]

ini_lr: 1e-4
lr_vision: 1e-4
lr_decoder: 1e-4
min_lr: 1e-6

use_lora: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.1

early_stopping: true
patience: 3
checkpointing: true

flash_attn: false
