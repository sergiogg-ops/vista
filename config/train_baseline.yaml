val_data_dir: /home/sgomgon/interlingua_img/OCRMT30k/precomputed_val/texts.json
# -----------------------
# Gemma
# model_path: google/gemma-4-E2B-it
# prompt: You are a professional {source_lang} to {target_lang} translator. Your goal is to accurately convey the meaning and nuances of the original {source_lang} text in the image while adhering to {target_lang} grammar, vocabulary, and cultural sensitivities. Produce only the {target_lang} translation, without any additional explanations or commentary. Please translate the {source_lang} text of the image into {target_lang}.
